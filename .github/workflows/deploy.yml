name: Deploy static site

# Cloudflare Pages watches main and builds independently. This workflow owns GitHub Pages.
# It also validates the exact static artifact that both hosting platforms serve.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["同步模型数据"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          # GITHUB_TOKEN 产生的数据提交不会再触发 push 工作流，因此由 workflow_run 接管。
          # 同步运行会先检出旧提交、再提交新数据，所以这里必须取默认分支的最新快照。
          ref: ${{ github.event_name == 'workflow_run' && github.event.repository.default_branch || github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Set GitHub Pages base path
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: echo "NEXT_BASE_PATH=/${REPOSITORY_NAME}" >> "$GITHUB_ENV"

      - name: Build
        env:
          NEXT_DIST_DIR: .next-pages
        run: |
          set -euo pipefail
          npm run build
          test -s .next-pages/index.html
          test -s .next-pages/legacy/index.html
          test -s .next-pages/universe/index.html
          test -d .next-pages/_next
          if [ -e out ]; then
            mv out "out.before-${GITHUB_RUN_ID}"
          fi
          mv .next-pages out

      - name: Verify Universe data coverage
        run: npm run verify:universe

      - name: Validate static export
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          test -s out/index.html
          test -s out/legacy/index.html
          test -s out/404.html
          test -s out/search-index.json
          test -s out/compare-data.json
          test -d out/sprites
          test "$(find out/sprites -type f -name '*.png' | wc -l | tr -d ' ')" -gt 0

          for page in \
            out/legacy/index.html \
            out/universe/index.html \
            out/universe/leaderboard/index.html \
            out/universe/models/index.html \
            out/universe/compare/index.html \
            out/universe/chronicle/index.html \
            out/universe/credits/index.html
          do
            test -s "$page" || {
              echo "::error::Missing static page: $page"
              exit 1
            }
          done

          model_page="$(find out/universe/model -mindepth 2 -maxdepth 2 -name index.html -print -quit)"
          vendor_page="$(find out/universe/vendor -mindepth 2 -maxdepth 2 -name index.html -print -quit)"
          test -n "$model_page"
          test -n "$vendor_page"
          test -s "$model_page"
          test -s "$vendor_page"

          # `/` is the public Universe experience. Keep the legacy plaza as an
          # explicit second surface so neither route can silently replace the other.
          grep -Fq 'class="universe-page"' out/index.html
          grep -Fq 'universe-district is-west' out/index.html
          grep -Fq 'universe-district is-east' out/index.html
          grep -Fq 'class="universe-page"' out/universe/index.html
          grep -Fq 'section-champions' out/legacy/index.html
          grep -Fq 'region-west' out/legacy/index.html
          grep -Fq 'region-east' out/legacy/index.html

          # The home page must ship both district sections (国外 / 国内) built from
          # the plaza roster, not just the star map. Counts are read off the HTML so a
          # regression that drops the sections fails the build instead of the eye test.
          #
          # The authoritative count check lives in `npm run verify:universe`, which
          # recomputes the plaza roster and compares it card by card. A fixed floor
          # here (it was 40) would still pass if a whole district vanished and needs
          # editing on every vendor sync, so this step only asserts what only the
          # rendered HTML can prove: both sections exist, and the two home routes
          # that share one component render exactly the same number of cards.
          headline_cards="$(grep -o '<article class="universe-district-card"' out/index.html | wc -l | tr -d ' ')"
          alias_cards="$(grep -o '<article class="universe-district-card"' out/universe/index.html | wc -l | tr -d ' ')"
          if [ "$headline_cards" -lt 1 ]; then
            echo "::error::Universe home rendered no district cards"
            exit 1
          fi
          if [ "$headline_cards" -ne "$alias_cards" ]; then
            echo "::error::/ rendered ${headline_cards} district cards but /universe/ rendered ${alias_cards}"
            exit 1
          fi
          echo "District cards in static export: ${headline_cards} (root and /universe/ agree; roster parity asserted by verify:universe)"

          # The attribution footer is a CC-BY obligation, and it must exist on the
          # public home route too — it silently disappeared there once before.
          for page in out/index.html out/universe/index.html; do
            grep -Fq 'universe-global-footer' "$page" || {
              echo "::error::$page is missing the attribution footer (CC-BY sources + 引流位)"
              exit 1
            }
          done

          grep -Fq "/${REPOSITORY_NAME}/_next/" out/index.html
          grep -Fq "/${REPOSITORY_NAME}/_next/" out/legacy/index.html
          grep -Fq "/${REPOSITORY_NAME}/_next/" out/universe/index.html
          grep -Fq "/${REPOSITORY_NAME}/sprites/" out/legacy/index.html

          if grep -Eq 'href="/_next/|src="/_next/|url\(/sprites/' \
            out/index.html out/legacy/index.html out/universe/index.html out/universe/models/index.html
          then
            echo "::error::Found root-absolute assets in a GitHub Pages build"
            exit 1
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
